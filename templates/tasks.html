<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Study Task Planner</title>
    <style>
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("{{ url_for('static', filename='backgrounds/bookshelf.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            z-index: -1;
        }

        #topic.placeholder {
            color: #999;
        }

        #expectedTime.placeholder {
            color: #999;
        }

        #dueDate.placeholder {
            color: #999;
        }

        #input-section input::placeholder {
            color: #999;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Craft Your Study Schedule</h1>
        
        <div id="input-section">
            <input type="text" id="taskName" placeholder="Task Name (e.g., Physics Homework)">
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <input type="text" id="dueDate" placeholder="Due Date"
                    onfocus="this.type='date'"
                    onblur="if(!this.value) this.type='text'">
            </div>
            <select id="topic">
                <option value="" disabled selected>Subject</option>
                <option value="Math">Math</option>
                <option value="Science">Science</option>
                <option value="Reading">Reading</option>
                <option value="Writing">Writing</option>
                <option value="History">History</option>
                <option value="Coding">Coding</option>
                <option value="Art">Art</option>
                <option value="Other">Other</option>
            </select>
            <select id="expectedTime">
                <option value="" disabled selected>Time to complete...</option>
                <option value="15">15 minutes</option>
                <option value="30">30 minutes</option>
                <option value="60">1 hour</option>
                <option value="120">2 hours</option>
                <option value="180">3+ hours</option>
            </select>
            <button id="add-task-btn" onclick="addTask()">Add Task to Schedule</button>
        </div>

        <div id="timer-settings" style="margin: 20px 0; text-align: center;">
            <label for="timerSplit" style="font-weight: bold; display: block; margin-bottom: 8px; font-size: 1.4rem;">Select Your Timer Split:</label>
            <select id="timerSplit" style="width: 100%; max-width: 400px; border: 2px solid #2c3e50;">
                <option value="1-0.25">Demo (1 min Work / 15 sec Break)</option>
                <option value="25-5" selected>Classic Pomodoro (25 min Work / 5 min Break)</option>
                <option value="45-15">Flexible (45 min Work / 15 min Break)</option>
                <option value="50-10">Deep Learning (50 min Work / 10 min Break)</option>
                <option value="90-30">Ultradian Rhythm (90 min Work / 30 min Break)</option>
            </select>
        </div>

        <hr>

        <div id="footer-task-dock">
            <h3>Your Sorted Schedule</h3>
            <div id="taskList">
                <p id="empty-msg">Tasks will appear here sorted by date and time. Drag to reorder manually.</p>
            </div>
        </div>
        <div class="nav-section">
            <button class="next-btn" onclick="goToNextPage()">Proceed to Study Session</button>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/task.js') }}"></script>
<script>
    const topicSelect = document.getElementById('topic');
    topicSelect.classList.add('placeholder');
    topicSelect.addEventListener('change', () => {
        topicSelect.classList.toggle('placeholder', topicSelect.value === '');
    });

    const timeSelect = document.getElementById('expectedTime');
    timeSelect.classList.add('placeholder');
    timeSelect.addEventListener('change', () => {
        timeSelect.classList.toggle('placeholder', timeSelect.value === '');
    });

    const dateInput = document.getElementById('dueDate');
    dateInput.classList.add('placeholder');
    dateInput.addEventListener('change', () => {
        dateInput.classList.toggle('placeholder', dateInput.value === '');
    });
    dateInput.addEventListener('input', () => {
        dateInput.classList.toggle('placeholder', dateInput.value === '');
    });
</script>
</body>
</html>
