<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        @font-face {
            font-family: 'Blockblueprint';
            src: url("{{ url_for('static', filename='fonts/Blockblueprint-LV7z5.ttf') }}") format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #loading-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            image-rendering: pixelated;
            display: block;
        }

        #loading-text {
            position: fixed;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Blockblueprint', Arial, sans-serif;
            font-size: 4rem;
            color: #3b2a1a;
            text-shadow: 2px 2px 0px #a07850;
            z-index: 10;
        }
    </style>
</head>
<body>
    <img id="loading-bg" src="{{ url_for('static', filename='backgrounds/pixil-gif-drawing (2).gif') }}" alt="Loading">
    <div id="loading-text">Matching study vibes...</div>

    <script>
        const gifDuration = 3000; // 3 seconds per loop
        const text = document.getElementById('loading-text');
        
        // Change text after first loop (3 seconds)
        setTimeout(() => {
            text.textContent = 'Generating your world...';
        }, 3000);
        
        // Redirect after second loop (6 seconds total)
        setTimeout(() => {
            window.location.href = '/pomodoro';
        }, 6000);
    </script>
</body>
</html>
