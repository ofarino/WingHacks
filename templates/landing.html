<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCraft</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        @font-face {
            font-family: 'Blockblueprint';
            src: url("{{ url_for('static', filename='fonts/Blockblueprint-LV7z5.ttf') }}") format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Blockblueprint', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            object-fit: cover;
            object-position: center;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .content h1 {
            font-family: 'Blockblueprint', Arial, sans-serif;
            font-size: clamp(3rem, 10vw, 5rem);
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .content p {
            font-family: 'Blockblueprint', Arial, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 2rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        .start-btn {
            font-family: 'Blockblueprint', Arial, sans-serif;
            padding: 20px 50px;
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            background-color: rgba(76, 175, 80, 0.9);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .start-btn:hover {
            background-color: rgba(56, 142, 60, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .content h1 {
                font-size: 3.5rem;
            }
            
            .content p {
                font-size: 1.8rem;
            }
            
            .start-btn {
                padding: 15px 35px;
                font-size: 1.4rem;
            }
        }

        @media (max-width: 480px) {
            .content h1 {
                font-size: 2.5rem;
            }
            
            .content p {
                font-size: 1.3rem;
            }
            
            .start-btn {
                padding: 12px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='backgrounds/LandingDog.mp4') }}" type="video/mp4">
    </video>

    <div class="content">
        <h1>MindCraft</h1>
        <p>Your smart study companion with focus tracking</p>
        <a href="{{ url_for('tasks') }}" class="start-btn">Start Studying</a>
    </div>
</body>
</html>
